<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Runtime campaign measurement boundaries</title>
  <desc id="desc">The diagram separates transform-only, HTTP Kafka-to-output, and gRPC send-to-response boundaries.</desc>
  <rect width="1120" height="420" fill="#0b1220"/>
  <text x="48" y="48" fill="#f8fafc" font-family="system-ui" font-size="24" font-weight="700">Measurement boundaries stay separate</text>
  <g font-family="system-ui" font-size="14" text-anchor="middle">
    <rect x="55" y="115" width="170" height="58" rx="8" fill="#172033" stroke="#475569"/><text x="140" y="149" fill="#e2e8f0">Kafka input</text>
    <rect x="285" y="115" width="170" height="58" rx="8" fill="#172033" stroke="#475569"/><text x="370" y="149" fill="#e2e8f0">HTTP bridge</text>
    <rect x="515" y="115" width="170" height="58" rx="8" fill="#0f3a4a" stroke="#38bdf8"/><text x="600" y="149" fill="#e2e8f0">Flowplane runtime</text>
    <rect x="745" y="115" width="170" height="58" rx="8" fill="#172033" stroke="#475569"/><text x="830" y="149" fill="#e2e8f0">Kafka output</text>
    <path d="M225 144H285M455 144H515M685 144H745" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <path d="M140 210V245H830V210" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="485" y="273" fill="#fbbf24">Kafka-to-output boundary</text>
    <path d="M540 195V300H660V195" fill="none" stroke="#34d399" stroke-width="3"/><text x="600" y="326" fill="#6ee7b7">Transform-only boundary</text>
    <rect x="55" y="350" width="170" height="42" rx="8" fill="#172033" stroke="#475569"/><text x="140" y="376" fill="#e2e8f0">gRPC client send</text>
    <rect x="515" y="350" width="170" height="42" rx="8" fill="#0f3a4a" stroke="#38bdf8"/><text x="600" y="376" fill="#e2e8f0">gRPC runtime</text>
    <rect x="745" y="350" width="170" height="42" rx="8" fill="#172033" stroke="#475569"/><text x="830" y="376" fill="#e2e8f0">Client response</text>
    <path d="M225 371H515M685 371H745" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="370" y="347" fill="#c4b5fd">send-to-response boundary spans client, transport, runtime, and flow control</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
</svg>
